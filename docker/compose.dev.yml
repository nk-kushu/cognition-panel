# Layer on top of compose.standalone.yml; paths are relative to that file.
services:
  frontend:
    build:
      target: development
    command:
      [
        "pnpm",
        "--filter",
        "@kushex/standalone",
        "dev",
        "--host",
        "0.0.0.0",
        "--port",
        "80",
        "--strictPort",
      ]
    init: true
    environment:
      NODE_ENV: development
      API_PROXY_TARGET: http://backend:3000
      # Editor links must point at the host checkout rather than /app in Docker.
      VITE_LOCATOR_PROJECT_PATH: ${LOCATOR_PROJECT_PATH:-}
      # Polling makes source edits reliable across Docker Desktop bind mounts.
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ../apps/standalone/src:/app/apps/standalone/src
      - ../apps/standalone/index.html:/app/apps/standalone/index.html
      - ../apps/standalone/vite.config.ts:/app/apps/standalone/vite.config.ts
      - ../plugins:/app/plugins:ro
      - ../packages/ui/src:/app/packages/ui/src
      - ../packages/debug-events/src:/app/packages/debug-events/src:ro
      - ../packages/contracts/src:/app/packages/contracts/src

  migrate:
    build:
      target: development
    command: ["pnpm", "--filter", "@kushex/server", "migrate"]
    environment:
      NODE_ENV: development
    volumes:
      - ../packages/server/prisma:/app/packages/server/prisma
      - ../packages/server/prisma.config.ts:/app/packages/server/prisma.config.ts

  backend:
    build:
      target: development
    command: ["pnpm", "--filter", "@kushex/server", "dev"]
    environment:
      NODE_ENV: development
      # pnpm keeps workspace dependencies under their owning package in development.
      KUSHEX_KUSHIBOT_DIR: /app/packages/server/node_modules/kushibot
    volumes:
      - ../packages/server/src:/app/packages/server/src
      - ../packages/contracts/src:/app/packages/contracts/src
      - ../packages/server/prisma:/app/packages/server/prisma
      - ../packages/server/prisma.config.ts:/app/packages/server/prisma.config.ts
      - ../packages/server/tsconfig.json:/app/packages/server/tsconfig.json
